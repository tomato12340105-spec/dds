name: AI Review

on:
  pull_request:

jobs:
  ai_review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        run: pip install requests pytest pytest-cov

      - name: run pytest
        run: |
          if ls test_*.py *_test.py 1> /dev/null 2>&1; then
          pytest --cov=. --cov-report=term --disable-warnings
        else
          echo "No tests found. Skipping pytest."
          fi

      - name: run AI review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python ai_review.py | tee ai_result.txt

      - name: comment PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('ai_result.txt')
              ? fs.readFileSync('ai_result.txt', 'utf8')
              : 'AI review failed before output was generated.';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🤖 AI Review\n\n```\n" + body + "\n```"
            });